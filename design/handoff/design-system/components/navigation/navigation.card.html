<!-- @dsCard group="Components" viewport="700x300" name="Navigation" subtitle="UtilityBar, PillNav, Tabs (pill / underline), Stepper" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-ui);background:var(--bg-page);color:var(--text-primary)}</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const NS = Object.values(window).find(v => v && typeof v === "object" && v.PillNav && v.Tabs) || {};
const { UtilityBar, PillNav, Tabs, Stepper, IconButton } = NS;
function Demo() { const [p, setP] = React.useState("Pain Centre"); const [t, setT] = React.useState("Low energy"); const [u, setU] = React.useState("Back & neck");
  return <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    <div style={{ borderRadius: 16, overflow: "hidden", border: "1px solid var(--border-default)" }}><UtilityBar status="Open until 4pm" open links={[{ label: "For referring doctors ›", accent: true }]} right={<span style={{ display: "flex", gap: 4 }}><IconButton size={26} inverse label="Smaller">A−</IconButton><IconButton size={26} inverse active label="Default">A</IconButton><IconButton size={26} inverse label="Larger">A+</IconButton></span>} /><PillNav items={["Family Medicine", "Pain Centre", "Infusion", "Aesthetics", "Rehab", "About"]} active={p} onSelect={setP} right={<IconButton label="Search">⌕</IconButton>} /></div>
    <div style={{ background: "var(--rm-ink)", borderRadius: 16, padding: 14 }}><Tabs inverse tabs={["Low energy", "Back or neck pain", "After a car accident", "Turning 50"]} value={t} onChange={setT} /></div>
    <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 14, alignItems: "center" }}><Tabs variant="underline" tabs={[{ value: "Back & neck", label: "Back & neck" }, { value: "Joint pain", label: "Joint pain" }, { value: "Nerve blocks", label: "Nerve blocks", count: 4 }]} value={u} onChange={setU} /><Stepper steps={["Details", "Time", "Confirm"]} current={2} /></div>
  </div>; }
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
