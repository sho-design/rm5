<!-- @dsCard group="Components" viewport="700x470" name="Feedback" subtitle="Tag tones, Notice (inline / toast), StateCard outcomes" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-ui);background:var(--bg-page);color:var(--text-primary)}</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const NS = Object.values(window).find(v => v && typeof v === "object" && v.Tag && v.StateCard) || {};
const { Tag, Notice, StateCard, Button } = NS;
ReactDOM.createRoot(document.getElementById("root")).render(<div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}><Tag>OHIP</Tag><Tag tone="sun">Coming soon</Tag><Tag tone="success" dot>Open now</Tag><Tag tone="warning">Uninsured</Tag><Tag tone="error">Closed</Tag><Tag tone="info">Same week</Tag><Tag tone="family">Family Medicine</Tag><Tag tone="pain">Pain Centre</Tag><Tag tone="infusion">Infusion</Tag><Tag tone="aesthetics">Aesthetics</Tag><Tag tone="rehab">Rehab</Tag><span style={{ background: "var(--rm-ink)", borderRadius: 999, padding: 2 }}><Tag tone="inverse">On navy</Tag></span></div>
  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
    <Notice tone="warning" title="Nothing that works?" action={{ label: "Join the waitlist" }}>We call in order when a cancellation opens, usually within a few days.</Notice>
    <Notice tone="success" title="Reminder sent" onDismiss={() => {}}>We will text you the day before.</Notice>
    <Notice tone="info">Your assessment and bloodwork are OHIP-insured. The infusion visit is not.</Notice>
    <Notice tone="error" title="Could not send">Check your connection and try again, or call 905-709-3222.</Notice>
  </div>
  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
    <StateCard style={{ padding: 24, gap: 14 }} title="You are booked." lead="Confirmation on its way by text and email." facts={[{ k: "When", v: "Sat Sep 20, 9:00 am" }, { k: "Where", v: "700 Centre St", sub: "Inside Walmart" }]} actions={<><Button size="sm">Add to calendar</Button><Button size="sm" variant="ghost">Reschedule</Button></>} />
    <StateCard style={{ padding: 24, gap: 14 }} tone="error" title="That time was just taken." lead="Your details are saved. Pick another time, or call us." actions={<><Button size="sm">Choose another time</Button><Button size="sm" variant="outline">Call</Button></>} />
  </div>
</div>);
</script></body></html>
