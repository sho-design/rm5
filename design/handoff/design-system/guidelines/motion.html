<!-- @dsCard group="Motion" viewport="700x130" subtitle="200 to 400ms, cubic-bezier(.2,.8,.2,1). Hover: border to sky or bg tint. Press: scale .98" name="Easing and duration" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-ui);color:var(--text-primary);background:var(--bg-page)}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:10px;align-items:center"><style>.m:hover{border-color:var(--rm-sky)!important;background:var(--rm-sky-soft)!important}.m:active{transform:scale(.98)}.c{transition:transform .25s var(--ease-standard)}.c:hover{transform:rotate(45deg)}</style><div class="m" style="flex:1;padding:14px 16px;border-radius:16px;border:1.5px solid var(--border-default);background:#fff;font-size:13px;font-weight:600;transition:var(--transition-all);cursor:pointer">Hover me: border and tint, 250ms</div><div style="flex:1;padding:14px 16px;border-radius:16px;background:var(--surface-card);display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;cursor:pointer">Accordion<span class="c" style="width:26px;height:26px;border-radius:50%;border:1px solid var(--border-default);display:inline-flex;align-items:center;justify-content:center">+</span></div><div style="flex:1;font-size:11px;color:var(--text-muted);line-height:1.5">No bounces, no parallax. Icons animate individually on hover. Respect reduced-motion.</div></div></body></html>
