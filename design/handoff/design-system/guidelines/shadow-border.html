<!-- @dsCard group="Spacing" viewport="700x150" subtitle="1px lines, 1.5px interactive, 2px selected. One soft shadow for floating results" name="Borders and shadow" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-ui);color:var(--text-primary);background:var(--bg-page)}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:10px"><div style="flex:1;border-radius:16px;border:1px solid var(--border-default);padding:14px;font-size:12px">1px line<br><span style="color:var(--text-muted)">cards, rows</span></div><div style="flex:1;border-radius:16px;border:1.5px solid var(--border-default);padding:14px;font-size:12px">1.5px<br><span style="color:var(--text-muted)">chips, fields, options</span></div><div style="flex:1;border-radius:16px;border:2px solid var(--border-strong);padding:14px;font-size:12px">2px ink<br><span style="color:var(--text-muted)">selected, hotspots</span></div><div style="flex:1;border-radius:16px;background:#fff;box-shadow:var(--shadow-card);padding:14px;font-size:12px">Soft shadow<br><span style="color:var(--text-muted)">result cards only</span></div></div></body></html>
