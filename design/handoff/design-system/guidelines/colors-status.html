<!-- @dsCard group="Colors" viewport="700x120" subtitle="Success, warning, error, info. Full-opacity ink on tinted grounds" name="Status" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-ui);color:var(--text-primary);background:var(--bg-page)}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:10px"><div style="flex:1;border-radius:14px;background:var(--status-success-bg);padding:14px 16px;display:flex;flex-direction:column;gap:4px"><span style="font-size:14px;font-weight:600;color:var(--status-success-fg)">Success</span><span style="font-size:12px;color:var(--text-secondary)">--status-success-bg / -fg</span></div><div style="flex:1;border-radius:14px;background:var(--status-warning-bg);padding:14px 16px;display:flex;flex-direction:column;gap:4px"><span style="font-size:14px;font-weight:600;color:var(--status-warning-fg)">Warning</span><span style="font-size:12px;color:var(--text-secondary)">--status-warning-bg / -fg</span></div><div style="flex:1;border-radius:14px;background:var(--status-error-bg);padding:14px 16px;display:flex;flex-direction:column;gap:4px"><span style="font-size:14px;font-weight:600;color:var(--status-error-fg)">Error</span><span style="font-size:12px;color:var(--text-secondary)">--status-error-bg / -fg</span></div><div style="flex:1;border-radius:14px;background:var(--status-info-bg);padding:14px 16px;display:flex;flex-direction:column;gap:4px"><span style="font-size:14px;font-weight:600;color:var(--status-info-fg)">Info</span><span style="font-size:12px;color:var(--text-secondary)">--status-info-bg / -fg</span></div></div></body></html>
