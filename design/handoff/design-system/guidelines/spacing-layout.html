<!-- @dsCard group="Spacing" viewport="700x200" subtitle="Rounded blocks sit 24 from the edge; text sections use a 32 gutter; card grids gap 12" name="Layout rhythm" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-ui);color:var(--text-primary);background:var(--bg-page)}*{box-sizing:border-box}</style></head><body><div style="border-radius:16px;background:var(--bg-canvas);padding:12px;display:flex;flex-direction:column;gap:12px"><div style="height:56px;border-radius:14px;background:var(--surface-inverse);color:var(--text-on-inverse);display:flex;align-items:center;padding:0 16px;font-size:11px">Full-bleed block, margin 24, radius 28</div><div style="padding:0 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px"><div style="height:44px;border-radius:12px;background:var(--surface-card);border:1px solid var(--border-default)"></div><div style="height:44px;border-radius:12px;background:var(--surface-card);border:1px solid var(--border-default)"></div><div style="height:44px;border-radius:12px;background:var(--surface-card);border:1px solid var(--border-default)"></div></div><span style="font-size:10px;color:var(--text-muted);padding:0 8px">Content padding 32, card gap 12, section gap 72</span></div></body></html>
