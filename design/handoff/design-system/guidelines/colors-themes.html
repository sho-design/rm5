<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-ui);color:var(--text-primary);background:var(--bg-page)}*{box-sizing:border-box}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><div data-theme="" style="border-radius:16px;background:var(--bg-page);border:var(--border-width) solid var(--border-default);padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--text-primary)"><span style="font-size:11px;font-weight:600;color:var(--text-muted)">data-theme="light"</span><span style="font-family:var(--font-display);font-size:22px;font-weight:500;letter-spacing:-.02em">Open now</span><div style="display:flex;gap:6px"><span style="background:var(--action-primary-bg);color:var(--action-primary-fg);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600">Book</span><span style="background:var(--div-family);color:var(--div-family-accent);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600">Family</span></div><span style="font-size:12px;color:var(--text-muted)">Muted text on card</span></div><div data-theme="dark" style="border-radius:16px;background:var(--bg-page);border:var(--border-width) solid var(--border-default);padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--text-primary)"><span style="font-size:11px;font-weight:600;color:var(--text-muted)">data-theme="dark"</span><span style="font-family:var(--font-display);font-size:22px;font-weight:500;letter-spacing:-.02em">Open now</span><div style="display:flex;gap:6px"><span style="background:var(--action-primary-bg);color:var(--action-primary-fg);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600">Book</span><span style="background:var(--div-family);color:var(--div-family-accent);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600">Family</span></div><span style="font-size:12px;color:var(--text-muted)">Muted text on card</span></div><div data-theme="contrast" style="border-radius:16px;background:var(--bg-page);border:var(--border-width) solid var(--border-default);padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--text-primary)"><span style="font-size:11px;font-weight:600;color:var(--text-muted)">data-theme="contrast"</span><span style="font-family:var(--font-display);font-size:22px;font-weight:500;letter-spacing:-.02em">Open now</span><div style="display:flex;gap:6px"><span style="background:var(--action-primary-bg);color:var(--action-primary-fg);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600">Book</span><span style="background:var(--div-family);color:var(--div-family-accent);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600">Family</span></div><span style="font-size:12px;color:var(--text-muted)">Muted text on card</span></div></div></body></html>
